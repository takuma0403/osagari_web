# air（ホットリロード）の設定。compose の api サービスから使う。
root = "."
tmp_dir = "/tmp/air"

[build]
  cmd = "go build -o /tmp/air/api ./cmd/api"
  entrypoint = ["/tmp/air/api"]
  include_ext = ["go"]
  exclude_dir = ["migrations", "dev", "bin", "tmp"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  kill_delay = "1s"
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
