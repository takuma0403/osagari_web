# ローカル開発環境（server/ で `docker compose up -d`）。
# 値はすべてローカル専用の非機密値。本番の値は Secret Manager に置く（ARCH）。

name: osagari

x-go-env: &go-env
  DATABASE_URL: http://db:8080
  MIGRATIONS_URL: file://migrations

services:
  # Turso 互換の libSQL サーバー（DB）
  db:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.33
    ports:
      - "8081:8080"
    volumes:
      - db-data:/var/lib/sqld
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 2s
      timeout: 2s
      retries: 15

  # 学生証の Cloud Storage のエミュレータ（STORAGE）
  storage:
    image: fsouza/fake-gcs-server:1.56.1
    command:
      - -scheme=http
      - -port=4443
      - -backend=filesystem
      - -filesystem-root=/storage
      - -public-host=localhost:4443
      - -external-url=http://localhost:4443
      # 署名付きURLの署名に含まれるヘッダー。ブラウザからの PUT のプリフライトで許可する（STORAGE）
      - -cors-headers=x-goog-content-length-range,x-goog-if-generation-match
    ports:
      - "4443:4443"
    volumes:
      - storage-data:/storage

  # 学生証のバケットを作る（一度だけ実行して終了）
  storage-init:
    image: curlimages/curl:8.17.0
    depends_on:
      storage:
        condition: service_started
    entrypoint: ["sh", "/init/storage-init.sh"]
    environment:
      STORAGE_URL: http://storage:4443
      BUCKETS: student-cards
    volumes:
      - ./dev/storage-init.sh:/init/storage-init.sh:ro

  # 商品写真の S3 互換ストレージ（本番は Cloudflare R2。STORAGE, ADR 0051）。
  # R2 と同じく署名付きURLの署名と条件（Content-Type・Content-Length・If-None-Match）を検証する。
  # 管理画面: http://localhost:9001（ユーザー名・パスワードは下の値）
  s3:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: local-access-key
      RUSTFS_SECRET_KEY: local-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 15

  # 商品写真のバケットを作り、CORS を設定する（一度だけ実行して終了）
  s3-init:
    image: amazon/aws-cli:2.37.10
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["sh", "/init/s3-init.sh"]
    environment:
      S3_URL: http://s3:9000
      AWS_ACCESS_KEY_ID: local-access-key
      AWS_SECRET_ACCESS_KEY: local-secret-key
      AWS_REGION: us-east-1
      BUCKETS: item-images
      # app の開発サーバー（Vite）。本番の R2 は Firebase Hosting の標準ドメインだけを許可する
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ./dev/s3-init.sh:/init/s3-init.sh:ro

  # 認証コードなどのメールを受け取るモック SMTP（Web UI: http://localhost:8025）
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  # マイグレーションを適用する（一度だけ実行して終了）
  migrate:
    build:
      context: .
      target: dev
    command: ["go", "run", "./cmd/migrate", "up"]
    environment:
      <<: *go-env
    volumes: &go-volumes
      - ..:/workspace
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy

  # API（Go + Echo、air でホットリロード）
  api:
    build:
      context: .
      target: dev
    ports:
      - "8080:8080"
    environment:
      <<: *go-env
      PORT: "8080"
      STORAGE_EMULATOR_HOST: storage:4443
      STORAGE_PUBLIC_HOST: localhost:4443
      STORAGE_BUCKET_STUDENT_CARDS: student-cards
      # 商品写真の S3 互換ストレージ（ADR 0051）。API からは s3:9000、署名付きURLにはブラウザから届くホストを入れる
      S3_ENDPOINT: http://s3:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET_ITEM_IMAGES: item-images
      S3_ACCESS_KEY_ID: local-access-key
      S3_SECRET_ACCESS_KEY: local-secret-key
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_FROM: お下がりフリマ <noreply@osagari.local>
      SMTP_STARTTLS: "false"
      # 管理者の学籍番号（ADR 0015）。例：ADMIN_STUDENT_NUMBERS=26141023 docker compose up -d
      ADMIN_STUDENT_NUMBERS: ${ADMIN_STUDENT_NUMBERS:-}
      # 内部用エンドポイントのローカルの代替認証（JOBS-1, ADR 0027）。
      # 例：curl -X POST -H 'Authorization: Bearer local-jobs-secret' localhost:8080/api/internal/jobs/short
      JOBS_LOCAL_SECRET: local-jobs-secret
    volumes: *go-volumes
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      mail:
        condition: service_started

volumes:
  db-data:
  storage-data:
  s3-data:
  go-mod:
  go-build:
