# PR・push ごとに server・app・docs を検査する（#4）。
# 変更パスで job を絞る。workflow レベルの paths だと必須チェックが待機中のまま残るため、changes job の結果で各 job をスキップする。

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      app: ${{ steps.filter.outputs.app }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'docs/api/**'
              - '.github/workflows/ci.yml'
            app:
              - 'app/**'
              - 'docs/api/**'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '**/*.md'
              - '.claude/**'
              - 'scripts/check-docs.mjs'
              - '.github/workflows/ci.yml'

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # libSQL の統合テスト用。compose の db と同じイメージ（ADR 0002）
    services:
      db:
        image: ghcr.io/tursodatabase/libsql-server:v0.24.33
        ports:
          - 8080:8080
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      # go-libsql は cgo が必要
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt されていないファイル:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test（libSQL 統合テストを含む）
        run: go test ./...
        env:
          TEST_DATABASE_URL: http://localhost:8080
      - name: 生成物の差分検査（api.gen.go, API-1）
        run: |
          go generate ./internal/api
          git diff --exit-code -- internal/api/api.gen.go

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # 全 story の描画と a11y 検査（DS-1, DS-3, ADR 0005）。Chromium はバージョンごとにキャッシュし、OS の依存パッケージだけ毎回入れる
      - name: Playwright のバージョン
        id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:storybook
      - run: npm run build-storybook
      - run: npm run build
      - name: 生成物の差分検査（schema.gen.ts, API-1）
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.gen.ts

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-docs.mjs
