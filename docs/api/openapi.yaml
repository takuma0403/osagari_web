      type: object
      description: DEAL-3 購入者が読み取った・開いた・入力したトークン
      required: [kind, secret]
      properties:
        kind:
          $ref: '#/components/schemas/HandoverTokenKind'
        secret:
          type: string
          description: qr・link はトークン、code は6桁のコード
    Transaction:
      type: object
      description: |
        DEAL 取引（購入希望の段階を含む）。`counterpartStudentNumber` は承認（取引成立）の後だけ入り、それより前は null（DEAL-1）。
        手数料の3項目は出品者にだけ、取引成立の後に入る（PAY-2, ADR 0003）。
      required: [id, role, status, item, price, paymentMethod, approvalDeadline, feeRateBasisPoints, fee, sellerProceeds, identityDisclosedAt, sellerAcknowledgedAt, buyerCancelAgreedAt, sellerCancelAgreedAt, completedAt, handoverMethod, counterpartStudentNumber, createdAt]
      properties:
        id:
          type: string
        role:
          $ref: '#/components/schemas/TransactionRole'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        item:
          $ref: '#/components/schemas/TransactionItem'
        price:
          type: integer
          format: int64
          description: 金額（購入希望の時点の商品価格。円）
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        approvalDeadline:
          type: string
          format: date-time
          description: 承認期限（購入希望から48時間）
        feeRateBasisPoints:
          type: integer
          nullable: true
          description: 適用した手数料率（ベーシスポイント）。出品者で取引成立後だけ入る
        fee:
          type: integer
          format: int64
          nullable: true
          description: 手数料（円）。出品者で取引成立後だけ入る
        sellerProceeds:
          type: integer
          format: int64
          nullable: true
          description: 出品者の売上（円）。出品者で取引成立後だけ入る
        identityDisclosedAt:
          type: string
          format: date-time
          nullable: true
          description: 学籍番号を開示した日時（承認時）
        sellerAcknowledgedAt:
          type: string
          format: date-time
          nullable: true
          description: 出品者が確認モーダルに同意した日時（DEAL-2）
        buyerCancelAgreedAt:
          type: string
          format: date-time
          nullable: true
          description: 購入者がキャンセルに同意（申請）した日時（DEAL-4）。取り下げたら null
        sellerCancelAgreedAt:
          type: string
          format: date-time
          nullable: true
          description: 出品者がキャンセルに同意（申請）した日時（DEAL-4）。取り下げたら null
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: 受け渡しが完了した日時（DEAL-3）
        handoverMethod:
          allOf:
            - $ref: '#/components/schemas/HandoverMethod'
          nullable: true
          description: 受け渡しの完了方法。完了前は null
        counterpartStudentNumber:
          type: string
          nullable: true
          description: 相手の学籍番号。承認の後だけ入る（DEAL-1）
        createdAt:
          type: string
          format: date-time
          description: 購入希望を出した日時
    TransactionItem:
      type: object
      description: 取引に出す商品の情報
      required: [shareId, title, status]
      properties:
        shareId:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/ItemStatus'
    TransactionPhase:
      type: string
      description: 取引一覧の区分。active は進行中、ended は終了した取引
      enum: [active, ended]
    TransactionList:
      type: object
      description: DEAL 取引一覧（DealList）の1区分
      required: [entries, nextCursor]
      properties:
        entries:
          type: array
          description: 最後に動いた日時の新しい順
          items:
            $ref: '#/components/schemas/TransactionListEntry'
        nextCursor:
          type: string
          nullable: true
          description: 続きを取るときに cursor に入れる値。続きがなければ null（active は常に null）
    TransactionListEntry:
      type: object
      description: |
        DEAL 取引一覧の1行。ふつうは取引1件だが、出品側の承認待ちの購入希望は商品ごとに1行にまとめる（status が requested、transactionId が null、requestCount が件数）。
        学籍番号・手数料は含めない（DEAL-1）。
      required: [transactionId, itemId, status, item, price, requestCount, approvalDeadline, completedAt, updatedAt]
      properties:
        transactionId:
          type: string
          nullable: true
          description: 取引のID（`/deals/:dealId`）。出品側の商品ごとの承認待ちの行は null
        itemId:
          type: string
          nullable: true
          description: 商品のID。出品側だけ入る（購入希望の一覧 `/sell/:itemId/requests` に使う）。購入側は null
        status:
          $ref: '#/components/schemas/TransactionStatus'
        item:
          $ref: '#/components/schemas/TransactionListItem'
        price:
          type: integer
          format: int64
          description: 取引の金額（円）。出品側の商品ごとの承認待ちの行は今の商品価格
        requestCount:
          type: integer
          nullable: true
          description: 承認待ちの購入希望の件数。出品側の商品ごとの行だけ入る
        approvalDeadline:
          type: string
          format: date-time
          nullable: true
          description: 承認期限。購入側の購入希望（requested）だけ入る
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: 受け渡しが完了した日時。完了前は null
        updatedAt:
          type: string
          format: date-time
          description: 最後に動いた日時。出品側の商品ごとの行は最新の購入希望を出した日時
    TransactionListItem:
      type: object
      description: 取引一覧に出す商品の情報
      required: [shareId, title, category, thumbnail]
      properties:
        shareId:
          type: string
        title:
          type: string
        category:
          $ref: '#/components/schemas/ItemCategory'
        thumbnail:
          description: 1枚目の写真
          allOf:
            - $ref: '#/components/schemas/ItemImage'
          nullable: true
    SalesEntryState:
      type: string
      description: 売上の状態。awaiting_handover 受け渡し待ち / settled 確定（出金できる）/ paid_out 出金済み
      enum: [awaiting_handover, settled, paid_out]
    Sales:
      type: object
      description: PAY 売上管理（Sales）の集計と明細。金額はすべて円
      required: [availableAmount, awaitingHandoverAmount, paidOutAmount, entries]
      properties:
        availableAmount:
          type: integer
          format: int64
          description: 出金できる売上（settled の売上の合計）
        awaitingHandoverAmount:
          type: integer
          format: int64
          description: 受け渡し待ちの売上（awaiting_handover の売上の合計）
        paidOutAmount:
          type: integer
          format: int64
          description: 出金済みの売上（paid_out の売上の合計）
        entries:
          type: array
          description: 最後に動いた日時の新しい順
          items:
            $ref: '#/components/schemas/SalesEntry'
    SalesEntry:
      type: object
      description: PAY-2 売上の明細の1行（取引1件）。売上 = 金額 − 手数料
      required: [transactionId, item, state, price, feeRateBasisPoints, fee, sellerProceeds, approvedAt, completedAt, paidOutAt]
      properties:
        transactionId:
          type: string
        item:
          $ref: '#/components/schemas/TransactionListItem'
        state:
          $ref: '#/components/schemas/SalesEntryState'
        price:
          type: integer
          format: int64
          description: 取引の金額（円）
        feeRateBasisPoints:
          type: integer
          description: 取引に適用した手数料率（ベーシスポイント。取引成立時点の値）
        fee:
          type: integer
          format: int64
          description: 手数料（円）
        sellerProceeds:
          type: integer
          format: int64
          description: 出品者の売上（円）
        approvedAt:
          type: string
          format: date-time
          description: 取引が成立（出品者が承認）した日時
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: 受け渡しが完了した日時。受け渡し待ちなら null
        paidOutAt:
          type: string
          format: date-time
          nullable: true
          description: 出金した日時。出金前は null
    PurchaseRequestList:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          description: 希望の古い順
          items:
            $ref: '#/components/schemas/PurchaseRequest'
    PurchaseRequest:
      type: object
      description: DEAL-1 出品者に見せる承認待ちの購入希望。購入者の学籍番号は含めない
      required: [transactionId, requestedAt, approvalDeadline, buyer]
      properties:
        transactionId:
          type: string
        requestedAt:
          type: string
          format: date-time
          description: 購入希望を出した日時
        approvalDeadline:
          type: string
          format: date-time
          description: 承認期限
        buyer:
          $ref: '#/components/schemas/RequestBuyer'
    RequestBuyer:
      type: object
      description: 購入希望の一覧に出す購入者の情報。学籍番号は含めない（DEAL-1）
      required: [departmentName, admissionYear, completedDealCount]
      properties:
        departmentName:
          type: string
          nullable: true
          description: 学部・学科の名前。不明なら null
        admissionYear:
          type: integer
          description: 入学年度
        completedDealCount:
          type: integer
          description: 購入者・出品者として取引を完了した回数
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      description: すべてのエラー応答の共通形式
      required: [code, message]
      properties:
        code:
          type: string
          description: 機械で判定するためのエラーコード（snake_case。例 invalid_status_transition）。共通コードの一覧は docs/tech/api.md の API-1
          example: invalid_status_transition
        message:
          type: string
          description: 利用者に表示できる日本語のメッセージ
          example: この取引はすでに完了しています
security:
  - sessionCookie: []
