      type: object
      description: |
        DEAL-3 発行した受け渡しトークン。qr は token と code、link は token、code は code だけが入る。
        完了リンクの中身は `/deals/{transactionId}/complete#t=<token>`、QR の中身は `/deals/{transactionId}/complete#q=<token>`（ADR 0024, ADR 0025）。
      required: [kind, token, code, expiresAt]
      properties:
        kind:
          $ref: '#/components/schemas/HandoverTokenKind'
        token:
          type: string
          nullable: true
          description: QR・完了リンクに載せる使い捨てのトークン
        code:
          type: string
          nullable: true
          description: 6桁の確認コード・完了コード
          example: '582017'
        expiresAt:
          type: string
          format: date-time
          description: 有効期限（qr は5分後、link・code は24時間後）
