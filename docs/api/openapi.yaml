# 佐賀大お下がりフリマ API 契約（正本）
#
# - エンドポイントを追加・変更するときは、実装より先にこのファイルを更新する（.claude/skills/api-contract/SKILL.md）。
# - Go: oapi-codegen（Echo / strict server）で server/internal/api に生成する。
# - TS: openapi-typescript で app/src/api/schema.gen.ts に生成する。
# - スキーマ名・列挙値は docs/glossary.md に揃える。各 operation の description に章ID（例: DEAL-3）を書く。
openapi: 3.0.3
info:
  title: 佐賀大お下がりフリマ API
  version: 0.1.0
  description: |
    Firebase Hosting の rewrites で `/api/**` を Cloud Run に転送する（tech/api.md の API 章）。
    認証は `__session` Cookie（HttpOnly, Secure, SameSite=Lax）。端末識別子は `X-Device-Id` ヘッダーで送る（tech/auth.md の AUTHN-3）。
servers:
  - url: /api
tags:
  - name: system
    description: 稼働確認など
  - name: auth
    description: 新規登録・ログイン・パスワード再設定（AUTH-1, AUTHN）
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: 稼働確認
      security: []
      responses:
        '200':
          description: 稼働中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Error'
  /auth/signup/estimate:
    post:
      tags: [auth]
      operationId: estimateStudent
      summary: 学籍番号から学部・入学年度・有効期限を推定する
      description: |
        AUTH-2, AUTH-4: 新規登録画面の入力中の表示に使う。学籍番号から計算するだけで、登録済みかどうかには触れない。
        メールアドレスを URL に載せない（リクエストログに残さない）ため、本文で受け取る。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '200':
          description: 推定結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEstimate'
        default:
          $ref: '#/components/responses/Error'
  /auth/signup/codes:
    post:
      tags: [auth]
      operationId: sendSignupCode
      summary: 新規登録の認証コードを送る
      description: |
        AUTHN-2: 大学のメールアドレス（^\d{8}@edu\.cc\.saga-u\.ac\.jp$）に6桁のコード（10分有効）を送る。
        登録済みのアドレスにはコードの代わりに「登録済みです」の案内を送り、応答は未登録のときと同じにする（登録の有無を判別させない）。
        形式が違うアドレスには送らず 400 invalid_email を返す。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '202':
          description: 受け付けた（登録済みかどうかにかかわらず同じ応答）
        default:
          $ref: '#/components/responses/Error'
  /auth/signup/codes/verify:
    post:
      tags: [auth]
      operationId: verifySignupCode
      summary: 新規登録の認証コードを確認する
      description: |
        AUTHN-2, AUTHN-6: コードが一致したら、パスワード設定用の一時トークン（15分有効・一度だけ使える）と推定結果を返す。
        不一致は 400 invalid_verification_code（メッセージに残り回数）。期限切れ・使用済み・入力ミスが5回に達したコードは 400 verification_code_expired。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupCodeVerification'
      responses:
        '200':
          description: コードを確認した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupCodeVerified'
        default:
          $ref: '#/components/responses/Error'
  /auth/signup/complete:
    post:
      tags: [auth]
      operationId: completeSignup
      summary: パスワードを設定してアカウントを作成する
      description: |
        AUTHN-2, AUTH-2〜4, AUTHN-5: 一時トークンを使ってパスワード（10文字以上）を設定し、学籍番号から入学年度・学部・有効期限を計算してアカウントを作る。
        そのままログイン状態にし、`__session` Cookie を返す。`X-Device-Id` があれば、その端末を登録済みの端末にする（AUTHN-3）。
        トークンが無効・期限切れ・使用済みなら 400 invalid_setup_token、パスワードが短ければ 400 password_too_short。
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupCompletion'
      responses:
        '201':
          description: アカウントを作成し、ログイン状態にした
          headers:
            Set-Cookie:
              description: セッションの `__session` Cookie（HttpOnly, Secure, SameSite=Lax）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __session
  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: false
      description: ブラウザの localStorage に保存した端末識別子（AUTHN-3）
      schema:
        type: string
  responses:
    Error:
      description: エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    EmailInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: 大学のメールアドレス（学籍番号@edu.cc.saga-u.ac.jp）。前後の空白と大文字・小文字の違いは無視する
          example: 26238001@edu.cc.saga-u.ac.jp
    StudentEstimate:
      type: object
      description: AUTH-2, AUTH-4 学籍番号から推定した情報
      required: [studentNumber, admissionYear, departmentCode, department, departmentName, expiresOn]
      properties:
        studentNumber:
          type: string
          example: '26238001'
        admissionYear:
          type: integer
          description: 入学年度（学籍番号の上2桁 + 2000）
          example: 2026
        departmentCode:
          type: string
          description: 学部・学科コード（学籍番号の3〜5桁目）
          example: '238'
        department:
          type: string
          nullable: true
          description: AUTH-4 の表で確定した学部・学科のコード。表にないコードは null（不明）
          example: '238'
        departmentName:
          type: string
          nullable: true
          description: 学部・学科の名前。不明なら null
          example: 理工学部 理工学科
        expiresOn:
          type: string
          format: date
          description: 有効期限の初期値（入学年度 + 修業年限 の3月31日。不明なら4年）
          example: '2030-03-31'
    SignupCodeVerification:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          example: 26238001@edu.cc.saga-u.ac.jp
        code:
          type: string
          description: メールで届いた6桁のコード
          example: '012345'
    SignupCodeVerified:
      type: object
      required: [setupToken, estimate]
      properties:
        setupToken:
          type: string
          description: パスワード設定用の一時トークン（15分有効・一度だけ使える）
        estimate:
          $ref: '#/components/schemas/StudentEstimate'
    SignupCompletion:
      type: object
      required: [setupToken, password]
      properties:
        setupToken:
          type: string
        password:
          type: string
          description: 10文字以上（AUTHN-5）
          minLength: 10
    CurrentUser:
      type: object
      description: ログイン中の本人の情報。本人にだけ返す
      required: [id, email, studentNumber, admissionYear, departmentCode, department, departmentName, expiresOn, status, sellerStatus]
      properties:
        id:
          type: string
        email:
          type: string
        studentNumber:
          type: string
        admissionYear:
          type: integer
        departmentCode:
          type: string
        department:
          type: string
          nullable: true
        departmentName:
          type: string
          nullable: true
        expiresOn:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/UserStatus'
        sellerStatus:
          $ref: '#/components/schemas/SellerStatus'
    UserStatus:
      type: string
      description: ユーザーの状態
      enum: [active, suspended, expired, deleted]
    SellerStatus:
      type: string
      description: 出品者の承認状態
      enum: [none, pending, approved, rejected]
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      description: すべてのエラー応答の共通形式
      required: [code, message]
      properties:
        code:
          type: string
          description: 機械で判定するためのエラーコード（snake_case。例 invalid_status_transition）。共通コードの一覧は docs/tech/api.md の API-1
          example: invalid_status_transition
        message:
          type: string
          description: 利用者に表示できる日本語のメッセージ
          example: この取引はすでに完了しています
security:
  - sessionCookie: []
