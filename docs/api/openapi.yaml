# 佐賀大お下がりフリマ API 契約（正本）
#
# - エンドポイントを追加・変更するときは、実装より先にこのファイルを更新する（.claude/skills/api-contract/SKILL.md）。
# - Go: oapi-codegen（Echo / strict server）で server/internal/api に生成する。
# - TS: openapi-typescript で app/src/api/schema.gen.ts に生成する。
# - スキーマ名・列挙値は docs/glossary.md に揃える。各 operation の description に章ID（例: DEAL-3）を書く。
openapi: 3.0.3
info:
  title: 佐賀大お下がりフリマ API
  version: 0.1.0
  description: |
    Firebase Hosting の rewrites で `/api/**` を Cloud Run に転送する（tech/api.md の API 章）。
    認証は `__session` Cookie（HttpOnly, Secure, SameSite=Lax）。端末識別子は `X-Device-Id` ヘッダーで送る（tech/auth.md の AUTHN-3）。
servers:
  - url: /api
tags:
  - name: system
    description: 稼働確認など
  - name: auth
    description: 新規登録・ログイン・パスワード再設定（AUTH-1, AUTHN）
  - name: student-cards
    description: 学生証の登録と審査状況（CARD, STORAGE）
  - name: items
    description: 出品・編集・取り下げと商品写真（ITEM, STORAGE）
  - name: admin
    description: 管理者向け（ADMIN）。未ログイン・管理者でなければすべて 404 not_found（ADR 0015）
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: 稼働確認
      security: []
      responses:
        '200':
          description: 稼働中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Error'
  /auth/signup/estimate:
    post:
      tags: [auth]
      operationId: estimateStudent
      summary: 学籍番号から学部・入学年度・有効期限を推定する
      description: |
        AUTH-2, AUTH-4: 新規登録画面の入力中の表示に使う。学籍番号から計算するだけで、登録済みかどうかには触れない。
        メールアドレスを URL に載せない（リクエストログに残さない）ため、本文で受け取る。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '200':
          description: 推定結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentEstimate'
        default:
          $ref: '#/components/responses/Error'
  /auth/signup/codes:
    post:
      tags: [auth]
      operationId: sendSignupCode
      summary: 新規登録の認証コードを送る
      description: |
        AUTHN-2: 大学のメールアドレス（^\d{8}@edu\.cc\.saga-u\.ac\.jp$）に6桁のコード（10分有効）を送る。
        登録済みのアドレスにはコードの代わりに「登録済みです」の案内を送り、応答は未登録のときと同じにする（登録の有無を判別させない）。
        形式が違うアドレスには送らず 400 invalid_email を返す。
        同じアドレスへのコード送信は、用途（新規登録・パスワード再設定・ログインの再確認）をまとめて1分に1回・1時間に5回までで、超えたら送らずに 429 too_many_requests（AUTHN-6）。登録の有無にかかわらず同じように数える。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '202':
          description: 受け付けた（登録済みかどうかにかかわらず同じ応答）
        default:
          $ref: '#/components/responses/Error'
  /auth/signup/codes/verify:
    post:
      tags: [auth]
      operationId: verifySignupCode
      summary: 新規登録の認証コードを確認する
      description: |
        AUTHN-2, AUTHN-6: コードが一致したら、パスワード設定用の一時トークン（15分有効・一度だけ使える）と推定結果を返す。
        不一致は 400 invalid_verification_code（メッセージに残り回数）。期限切れ・使用済み・入力ミスが5回に達したコードは 400 verification_code_expired。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupCodeVerification'
      responses:
        '200':
          description: コードを確認した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupCodeVerified'
        default:
          $ref: '#/components/responses/Error'
  /auth/signup/complete:
    post:
      tags: [auth]
      operationId: completeSignup
      summary: パスワードを設定してアカウントを作成する
      description: |
        AUTHN-2, AUTH-2〜4, AUTHN-5: 一時トークンを使ってパスワード（10文字以上128文字以下）を設定し、学籍番号から入学年度・学部・有効期限を計算してアカウントを作る。
        そのままログイン状態にし、`__session` Cookie を返す。`X-Device-Id` があれば、その端末を登録済みの端末にする（AUTHN-3）。
        トークンが無効・期限切れ・使用済みなら 400 invalid_setup_token、パスワードの長さが範囲外なら 400 invalid_password_length。
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupCompletion'
      responses:
        '201':
          description: アカウントを作成し、ログイン状態にした
          headers:
            Set-Cookie:
              description: セッションの `__session` Cookie（HttpOnly, Secure, SameSite=Lax）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        default:
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: メールアドレスとパスワードでログインする
      description: |
        AUTH-1, AUTHN-3, AUTHN-5: パスワードが一致し、最後のコード確認から30日未満かつ登録済みの端末（`X-Device-Id`）なら、そのままログインして `__session` Cookie を返す（200）。
        30日以上たっているか初めての端末なら、メールに6桁のコード（10分有効）を送り、再確認用のログインチャレンジ（15分有効・一度だけ使える）を返す（202）。
        メールアドレスの形式違い・未登録・削除済み・パスワード違いは、区別せず 401 invalid_credentials（登録の有無を判別させない）。
        パスワードが一致しても、停止中なら 403 account_suspended、失効（有効期限切れを含む）なら 403 account_expired。
        AUTHN-6: パスワードの入力ミスが同じアドレスで10回続いたら、15分間は照合せずに 429 too_many_requests（未登録・削除済みのアドレスも同じように数えて止める）。パスワードが一致したら回数は0に戻る。
        202 でコードを送るときは、コード送信の回数制限（/auth/signup/codes を参照）に当たると 429 too_many_requests。
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: ログインした
          headers:
            Set-Cookie:
              description: セッションの `__session` Cookie（HttpOnly, Secure, SameSite=Lax）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '202':
          description: 再確認が必要。メールにコードを送った
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginChallenge'
        default:
          $ref: '#/components/responses/Error'
  /auth/login/recheck/codes:
    post:
      tags: [auth]
      operationId: resendLoginRecheckCode
      summary: 再確認のコードを送り直す
      description: |
        AUTHN-3: ログインチャレンジが有効なら、新しいコード（10分有効）を送る。古いコードは使えなくなる。
        チャレンジが無効・期限切れ・使用済みなら 400 invalid_login_challenge。
        AUTHN-6: コード送信の回数制限（/auth/signup/codes を参照）に当たったら 429 too_many_requests。断ったときは前のコードがそのまま使える。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginChallengeInput'
      responses:
        '202':
          description: コードを送った
        default:
          $ref: '#/components/responses/Error'
  /auth/login/recheck/verify:
    post:
      tags: [auth]
      operationId: verifyLoginRecheck
      summary: 再確認のコードを確認してログインする
      description: |
        AUTHN-3, AUTHN-6: コードが一致したら最後の確認日時を更新し、ログイン時の端末を登録済みの端末にして、`__session` Cookie を返す。
        不一致は 400 invalid_verification_code（メッセージに残り回数）。期限切れ・使用済み・入力ミスが5回に達したコードは 400 verification_code_expired。
        チャレンジが無効・期限切れ・使用済みなら 400 invalid_login_challenge。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRecheckVerification'
      responses:
        '200':
          description: ログインした
          headers:
            Set-Cookie:
              description: セッションの `__session` Cookie（HttpOnly, Secure, SameSite=Lax）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: ログアウトする
      description: |
        AUTHN-5: いまのセッションをすぐに無効にし、`__session` Cookie を消す。ログインしていなくても 204 を返す。
      security: []
      responses:
        '204':
          description: ログアウトした
          headers:
            Set-Cookie:
              description: "`__session` Cookie を消す"
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /auth/password-reset/codes:
    post:
      tags: [auth]
      operationId: sendPasswordResetCode
      summary: パスワード再設定の認証コードを送る
      description: |
        AUTHN-4: 登録済みのアドレスに6桁のコード（10分有効）を送る。
        未登録・削除済みのアドレスにはコードの代わりに「登録されていません」の案内を送り、応答は登録済みのときと同じにする（登録の有無を判別させない。AUTHN-2）。
        形式が違うアドレスには送らず 400 invalid_email を返す。
        同じアドレスへのコード送信は、用途（新規登録・パスワード再設定・ログインの再確認）をまとめて1分に1回・1時間に5回までで、超えたら送らずに 429 too_many_requests（AUTHN-6）。登録の有無にかかわらず同じように数える。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '202':
          description: 受け付けた（登録済みかどうかにかかわらず同じ応答）
        default:
          $ref: '#/components/responses/Error'
  /auth/password-reset/codes/verify:
    post:
      tags: [auth]
      operationId: verifyPasswordResetCode
      summary: パスワード再設定の認証コードを確認する
      description: |
        AUTHN-4, AUTHN-6: コードが一致したら、パスワード設定用の一時トークン（15分有効・一度だけ使える）を返す。
        不一致は 400 invalid_verification_code（メッセージに残り回数）。期限切れ・使用済み・入力ミスが5回に達したコードは 400 verification_code_expired。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCodeVerification'
      responses:
        '200':
          description: コードを確認した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetCodeVerified'
        default:
          $ref: '#/components/responses/Error'
  /auth/password-reset/complete:
    post:
      tags: [auth]
      operationId: completePasswordReset
      summary: 新しいパスワードを設定する
      description: |
        AUTHN-4, AUTHN-5: 一時トークンを使って新しいパスワード（10文字以上128文字以下）を設定し、その利用者の既存のセッションをすべて無効にする。
        コードで本人確認をしたので、最後の確認日時を更新し、そのままこの端末でログイン状態にして `__session` Cookie を返す。`X-Device-Id` があれば、その端末を登録済みの端末にする（AUTHN-3）。
        トークンが無効・期限切れ・使用済みなら 400 invalid_setup_token、パスワードの長さが範囲外なら 400 invalid_password_length。
        停止中なら 403 account_suspended、失効なら 403 account_expired を返し、パスワードは変えない。
        AUTHN-6: 設定したらパスワードの入力ミスの回数を0に戻す。ただしログインを止めている間（429）は期限まで止めたまま。
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCompletion'
      responses:
        '200':
          description: パスワードを変更し、ログイン状態にした
          headers:
            Set-Cookie:
              description: セッションの `__session` Cookie（HttpOnly, Secure, SameSite=Lax）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        default:
          $ref: '#/components/responses/Error'
  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: ログイン中の本人の情報を取得する
      description: |
        AUTH-1, AUTHN-5: `__session` のセッションが有効（期限内・未失効）で、ユーザーが有効（停止・失効・削除でない）なら本人の情報を返す。そうでなければ 401 unauthorized。
      responses:
        '200':
          description: 本人の情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        default:
          $ref: '#/components/responses/Error'
  /student-cards/uploads:
    post:
      tags: [student-cards]
      operationId: createStudentCardUpload
      summary: 学生証画像のアップロード用の署名付きURLを発行する
      description: |
        CARD, STORAGE: 非公開バケットに直接 PUT するための署名付きURL（15分有効）を発行する。ブラウザは返った `headers` を付けて `uploadUrl` に画像を PUT し、
        そのあと `objectKey` を `submitStudentCard` に送る。オブジェクト名は `{ユーザーID}/{UUID}`。
        すでに承認済みなら 409 invalid_status_transition。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCardUploadInput'
      responses:
        '201':
          description: 発行した署名付きURL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCardUpload'
        default:
          $ref: '#/components/responses/Error'
  /student-cards:
    post:
      tags: [student-cards]
      operationId: submitStudentCard
      summary: アップロードした学生証画像を登録して審査待ちにする
      description: |
        CARD, STORAGE: オブジェクトが本人のもので、アップロード済み・JPEG か WebP・5MB 以下なら学生証として登録し、出品者の承認状態を審査中（pending）にする。
        そうでなければ 400 invalid_student_card_upload。審査中・差し戻しのときの再提出は前の学生証を置き換える（前の画像も残す。ADR 0014）。
        すでに承認済みなら 409 invalid_status_transition。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCardSubmission'
      responses:
        '201':
          description: 登録後の審査状況
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCardState'
        default:
          $ref: '#/components/responses/Error'
  /student-cards/current:
    get:
      tags: [student-cards]
      operationId: getCurrentStudentCard
      summary: 本人の学生証の審査状況を取得する
      description: |
        CARD: 最後に提出した学生証の審査状況を返す。未登録なら status は none。画像の閲覧URLは返さない（管理者APIだけが発行する。STORAGE）。
      responses:
        '200':
          description: 審査状況
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCardState'
        default:
          $ref: '#/components/responses/Error'
  /items/image-uploads:
    post:
      tags: [items]
      operationId: createItemImageUpload
      summary: 商品写真のアップロード用の署名付きURLを発行する
      description: |
        ITEM, STORAGE: 商品写真のバケットに直接 PUT するための署名付きURL（15分有効、5MB まで）を発行する。ブラウザは返った `headers` を付けて `uploadUrl` に画像を PUT し、
        そのあと `objectKey` を createItem・updateItem の `imageObjectKeys` に入れる。オブジェクト名は `{ユーザーID}/{UUID}`。
        学生証が承認されていなければ 403 seller_not_approved。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageUploadInput'
      responses:
        '201':
          description: 発行した署名付きURL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUpload'
        default:
          $ref: '#/components/responses/Error'
  /items:
    post:
      tags: [items]
      operationId: createItem
      summary: 商品を出品する（下書きか公開）
      description: |
        ITEM: `publish` が false なら下書き（タイトルだけ必須）、true なら公開中として作る（すべての共通項目と写真1枚以上が必須）。
        入力が不正なら 400 bad_request、写真が不正なら 400 invalid_item_image_upload、学生証が承認されていなければ 403 seller_not_approved。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreation'
      responses:
        '201':
          description: 作った商品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnItem'
        default:
          $ref: '#/components/responses/Error'
  /items/{itemId}:
    get:
      tags: [items]
      operationId: getOwnItem
      summary: 自分の商品を取得する（編集用）
      description: |
        ITEM, STORAGE: 出品者本人の商品を、下書き・取り下げを含めて返す。写真には閲覧用の署名付きURL（15分有効）を付ける。
        ほかの人の商品は 404 not_found（存在するかどうかを区別しない）。公開されている商品を見るときは BROWSE の API を使う。
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: 商品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnItem'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags: [items]
      operationId: updateItem
      summary: 商品を編集する
      description: |
        ITEM: すべての項目を置き換える。写真は `imageObjectKeys` の並びが表示順になる。編集できるのは下書き・公開中・取り下げの商品だけで（ADR 0016）、
        それ以外は 409 invalid_status_transition。公開中の商品はすべての共通項目と写真1枚以上が必須、下書き・取り下げはタイトルだけ必須。
        ほかの人の商品は 404 not_found、学生証が承認されていなければ 403 seller_not_approved。
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
      responses:
        '200':
          description: 編集後の商品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnItem'
        default:
          $ref: '#/components/responses/Error'
  /items/{itemId}/publish:
    post:
      tags: [items]
      operationId: publishItem
      summary: 商品を公開する（再出品を含む）
      description: |
        ITEM: 下書きか取り下げの商品を公開中にする。それ以外は 409 invalid_status_transition（ADR 0016）。
        共通項目か写真が足りなければ 400 bad_request。ほかの人の商品は 404 not_found、学生証が承認されていなければ 403 seller_not_approved。
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: 公開後の商品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnItem'
        default:
          $ref: '#/components/responses/Error'
  /items/{itemId}/withdraw:
    post:
      tags: [items]
      operationId: withdrawItem
      summary: 商品を取り下げる
      description: |
        ITEM: 下書き・公開中・購入希望ありの商品を取り下げる。取引中・取引完了・停止などは 409 invalid_status_transition（ADR 0016）。
        ほかの人の商品は 404 not_found。
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: 取り下げ後の商品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnItem'
        default:
          $ref: '#/components/responses/Error'
  /admin/session:
    get:
      tags: [admin]
      operationId: getAdminSession
      summary: 管理者かどうかを確かめる
      description: |
        ADMIN, FE: 管理者なら 204。未ログイン・管理者でなければ 404 not_found（管理画面は 404 なら「ページが見つからない」を出す。ADR 0015）。
      responses:
        '204':
          description: 管理者
        default:
          $ref: '#/components/responses/Error'
  /admin/student-cards:
    get:
      tags: [admin]
      operationId: listPendingStudentCards
      summary: 審査待ちの学生証を一覧する
      description: |
        ADMIN, CARD: 審査待ち（pending）で置き換えられていない学生証を、提出の古い順に返す。画像の URL は含めない（createStudentCardView で発行する）。
      responses:
        '200':
          description: 審査待ちの学生証
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminStudentCard'
        default:
          $ref: '#/components/responses/Error'
  /admin/student-cards/{studentCardId}/views:
    post:
      tags: [admin]
      operationId: createStudentCardView
      summary: 学生証画像の閲覧URLを発行し、閲覧を記録する
      description: |
        ADMIN, CARD, STORAGE: 非公開バケットの画像を GET する署名付きURL（15分有効）を発行し、閲覧した管理者と日時を記録する。
        学生証がない・画像が削除済みなら 404 not_found。
      parameters:
        - $ref: '#/components/parameters/StudentCardId'
      responses:
        '201':
          description: 発行した閲覧URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCardImage'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags: [admin]
      operationId: listStudentCardViews
      summary: 学生証画像の閲覧記録を一覧する
      description: |
        ADMIN, CARD: その学生証の画像を閲覧した記録を新しい順に返す。学生証がなければ 404 not_found。
      parameters:
        - $ref: '#/components/parameters/StudentCardId'
      responses:
        '200':
          description: 閲覧記録
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentCardView'
        default:
          $ref: '#/components/responses/Error'
  /admin/student-cards/{studentCardId}/approve:
    post:
      tags: [admin]
      operationId: approveStudentCard
      summary: 学生証を承認する
      description: |
        ADMIN, CARD: 審査待ちで置き換えられていない学生証を承認し、本人の出品者の承認状態を approved にする。
        審査待ちでない・置き換えられた・本人が審査中でなければ 409 invalid_status_transition。学生証がなければ 404 not_found。
      parameters:
        - $ref: '#/components/parameters/StudentCardId'
      responses:
        '200':
          description: 承認後の学生証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStudentCard'
        default:
          $ref: '#/components/responses/Error'
  /admin/student-cards/{studentCardId}/reject:
    post:
      tags: [admin]
      operationId: rejectStudentCard
      summary: 学生証を差し戻す
      description: |
        ADMIN, CARD: 審査待ちで置き換えられていない学生証を差し戻し、本人の出品者の承認状態を rejected にする。理由は持たない（ADR 0015）。
        審査待ちでない・置き換えられた・本人が審査中でなければ 409 invalid_status_transition。学生証がなければ 404 not_found。
      parameters:
        - $ref: '#/components/parameters/StudentCardId'
      responses:
        '200':
          description: 差し戻し後の学生証
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStudentCard'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __session
  parameters:
    StudentCardId:
      name: studentCardId
      in: path
      required: true
      description: 学生証のID
      schema:
        type: string
    ItemId:
      name: itemId
      in: path
      required: true
      description: 商品のID
      schema:
        type: string
    DeviceId:
      name: X-Device-Id
      in: header
      required: false
      description: ブラウザの localStorage に保存した端末識別子（AUTHN-3）
      schema:
        type: string
  responses:
    Error:
      description: エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    EmailInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          description: 大学のメールアドレス（学籍番号@edu.cc.saga-u.ac.jp）。前後の空白と大文字・小文字の違いは無視する
          example: 26238001@edu.cc.saga-u.ac.jp
    StudentEstimate:
      type: object
      description: AUTH-2, AUTH-4 学籍番号から推定した情報
      required: [studentNumber, admissionYear, departmentCode, department, departmentName, expiresOn]
      properties:
        studentNumber:
          type: string
          example: '26238001'
        admissionYear:
          type: integer
          description: 入学年度（学籍番号の上2桁 + 2000）
          example: 2026
        departmentCode:
          type: string
          description: 学部・学科コード（学籍番号の3〜5桁目）
          example: '238'
        department:
          type: string
          nullable: true
          description: AUTH-4 の表で確定した学部・学科のコード。表にないコードは null（不明）
          example: '238'
        departmentName:
          type: string
          nullable: true
          description: 学部・学科の名前。不明なら null
          example: 理工学部 理工学科
        expiresOn:
          type: string
          format: date
          description: 有効期限の初期値（入学年度 + 修業年限 の3月31日。不明なら4年）
          example: '2030-03-31'
    SignupCodeVerification:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          example: 26238001@edu.cc.saga-u.ac.jp
        code:
          type: string
          description: メールで届いた6桁のコード
          example: '012345'
    SignupCodeVerified:
      type: object
      required: [setupToken, estimate]
      properties:
        setupToken:
          type: string
          description: パスワード設定用の一時トークン（15分有効・一度だけ使える）
        estimate:
          $ref: '#/components/schemas/StudentEstimate'
    SignupCompletion:
      type: object
      required: [setupToken, password]
      properties:
        setupToken:
          type: string
        password:
          type: string
          description: 10文字以上128文字以下（AUTHN-5）
          minLength: 10
          maxLength: 128
    PasswordResetCodeVerification:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          example: 26238001@edu.cc.saga-u.ac.jp
        code:
          type: string
          description: メールで届いた6桁のコード
          example: '012345'
    PasswordResetCodeVerified:
      type: object
      required: [setupToken]
      properties:
        setupToken:
          type: string
          description: パスワード設定用の一時トークン（15分有効・一度だけ使える）
    PasswordResetCompletion:
      type: object
      required: [setupToken, password]
      properties:
        setupToken:
          type: string
        password:
          type: string
          description: 10文字以上128文字以下（AUTHN-5）
          minLength: 10
          maxLength: 128
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: 大学のメールアドレス。前後の空白と大文字・小文字の違いは無視する
          example: 26238001@edu.cc.saga-u.ac.jp
        password:
          type: string
    LoginRecheckReason:
      type: string
      description: |
        再確認が必要な理由（AUTHN-3）。code_expired = 最後にコードで確認してから30日以上たった、new_device = 初めて使う端末。
        両方に当てはまるときは code_expired。
      enum: [code_expired, new_device]
    LoginChallenge:
      type: object
      description: AUTHN-3 再確認用のログインチャレンジ。パスワードが一致したことを表し、コードの確認・再送に使う
      required: [challengeToken, reason, email]
      properties:
        challengeToken:
          type: string
          description: ログインチャレンジのトークン（15分有効・一度だけ使える）
        reason:
          $ref: '#/components/schemas/LoginRecheckReason'
        email:
          type: string
          description: コードの送信先（ログインに使ったメールアドレス）
          example: 26238001@edu.cc.saga-u.ac.jp
    LoginChallengeInput:
      type: object
      required: [challengeToken]
      properties:
        challengeToken:
          type: string
    LoginRecheckVerification:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken:
          type: string
        code:
          type: string
          description: メールで届いた6桁のコード
          example: '012345'
    CurrentUser:
      type: object
      description: ログイン中の本人の情報。本人にだけ返す
      required: [id, email, studentNumber, admissionYear, departmentCode, department, departmentName, expiresOn, status, sellerStatus]
      properties:
        id:
          type: string
        email:
          type: string
        studentNumber:
          type: string
        admissionYear:
          type: integer
        departmentCode:
          type: string
        department:
          type: string
          nullable: true
        departmentName:
          type: string
          nullable: true
        expiresOn:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/UserStatus'
        sellerStatus:
          $ref: '#/components/schemas/SellerStatus'
    UserStatus:
      type: string
      description: ユーザーの状態
      enum: [active, suspended, expired, deleted]
    SellerStatus:
      type: string
      description: 出品者の承認状態
      enum: [none, pending, approved, rejected]
    StudentCardUploadInput:
      type: object
      required: [contentType]
      properties:
        contentType:
          type: string
          description: アップロードする画像の形式（ブラウザで縮小・圧縮したもの。STORAGE）
          enum: [image/jpeg, image/webp]
    StudentCardUpload:
      type: object
      description: STORAGE 学生証画像のアップロード先
      required: [objectKey, uploadUrl, method, headers, expiresAt]
      properties:
        objectKey:
          type: string
          description: 登録（submitStudentCard）で送るオブジェクト名
          example: 0b6c1f7e-1d2a-4c55-9a51-2f0f6f3d9c10/7d7f5a2e-3c1b-4f0e-8a0c-6c1e9b2d4f11
        uploadUrl:
          type: string
          description: 署名付きURL
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          description: PUT に付けるヘッダー（署名に含まれる。Content-Type など）
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
          description: 署名付きURLの有効期限
    StudentCardSubmission:
      type: object
      required: [objectKey]
      properties:
        objectKey:
          type: string
          description: createStudentCardUpload で受け取ったオブジェクト名
    StudentCardState:
      type: object
      description: CARD 本人の学生証の審査状況
      required: [status, submittedAt, reviewedAt]
      properties:
        status:
          $ref: '#/components/schemas/SellerStatus'
        submittedAt:
          type: string
          format: date-time
          nullable: true
          description: 最後に提出した日時。未登録なら null
        reviewedAt:
          type: string
          format: date-time
          nullable: true
          description: 審査した日時。審査前・未登録なら null
    StudentCardStatus:
      type: string
      description: 学生証の審査状態
      enum: [pending, approved, rejected]
    AdminStudentCard:
      type: object
      description: ADMIN 管理者に見せる学生証と本人の情報（審査で学籍番号を照合する。CARD）
      required: [id, status, studentNumber, departmentName, admissionYear, expiresOn, submittedAt, reviewedAt]
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/StudentCardStatus'
        studentNumber:
          type: string
          description: メールアドレスの学籍番号
        departmentName:
          type: string
          nullable: true
          description: 推定した学部・学科の表示名。不明なら null
        admissionYear:
          type: integer
        expiresOn:
          type: string
          format: date
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
          description: 審査した日時。審査前は null
    StudentCardImage:
      type: object
      description: STORAGE 学生証画像の閲覧URL（管理者だけに発行する）
      required: [url, expiresAt, viewedAt]
      properties:
        url:
          type: string
          description: 署名付きURL（GET）
        expiresAt:
          type: string
          format: date-time
          description: 署名付きURLの有効期限
        viewedAt:
          type: string
          format: date-time
          description: 記録した閲覧の日時
    StudentCardView:
      type: object
      description: ADMIN 学生証画像の閲覧記録
      required: [viewedAt, adminStudentNumber]
      properties:
        viewedAt:
          type: string
          format: date-time
        adminStudentNumber:
          type: string
          description: 閲覧した管理者の学籍番号
    ImageContentType:
      type: string
      description: アップロードする画像の形式（ブラウザで縮小・圧縮したもの。STORAGE）
      enum: [image/jpeg, image/webp]
    ImageUploadInput:
      type: object
      required: [contentType]
      properties:
        contentType:
          $ref: '#/components/schemas/ImageContentType'
    ImageUpload:
      type: object
      description: STORAGE 画像のアップロード先
      required: [objectKey, uploadUrl, method, headers, expiresAt]
      properties:
        objectKey:
          type: string
          description: 登録で送るオブジェクト名（`{ユーザーID}/{UUID}`）
        uploadUrl:
          type: string
          description: 署名付きURL
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          description: PUT に付けるヘッダー（署名に含まれる。Content-Type など）
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
          description: 署名付きURLの有効期限
    ItemStatus:
      type: string
      description: 商品のステータス
      enum: [draft, published, requested, in_deal, completed, withdrawn, suspended]
    ItemCategory:
      type: string
      description: カテゴリ
      enum: [textbook, furniture_appliance, game_other]
    ItemCondition:
      type: string
      description: 商品の状態（new_like 新品同様 / good 目立った傷なし / fair やや傷あり）
      enum: [new_like, good, fair]
    Campus:
      type: string
      description: 受け渡し希望キャンパス
      enum: [honjo, nabeshima]
    TextbookDetails:
      type: object
      description: ITEM 教科書・参考書の追加項目（どれも任意）
      properties:
        courseName:
          type: string
          maxLength: 100
          description: 授業名
        instructor:
          type: string
          maxLength: 100
          description: 担当教員
        isbn:
          type: string
          description: ISBN（10桁か13桁。ハイフンは除いて保存する）
          example: '9784000000000'
        hasWriting:
          type: boolean
          description: 書き込みの有無
    FurnitureApplianceDetails:
      type: object
      description: ITEM 家具・家電の追加項目（どれも任意）
      properties:
        size:
          type: string
          maxLength: 100
          description: サイズ
        operationChecked:
          type: boolean
          description: 動作確認の有無
    ItemInput:
      type: object
      description: |
        ITEM 出品・編集の入力。下書きはタイトルだけ必須で、公開するときはすべての共通項目と写真1枚以上が必須。
        `textbook` は category が textbook のときだけ、`furnitureAppliance` は furniture_appliance のときだけ送れる。
      required: [title, imageObjectKeys]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        category:
          $ref: '#/components/schemas/ItemCategory'
        condition:
          $ref: '#/components/schemas/ItemCondition'
        price:
          type: integer
          format: int64
          minimum: 100
          maximum: 100000
          description: 価格（円）
        description:
          type: string
          maxLength: 2000
          description: 説明文
        campus:
          $ref: '#/components/schemas/Campus'
        imageObjectKeys:
          type: array
          maxItems: 10
          description: createItemImageUpload で受け取ったオブジェクト名。並びが表示順
          items:
            type: string
        textbook:
          $ref: '#/components/schemas/TextbookDetails'
        furnitureAppliance:
          $ref: '#/components/schemas/FurnitureApplianceDetails'
    ItemCreation:
      description: ITEM 出品の入力
      allOf:
        - $ref: '#/components/schemas/ItemInput'
        - type: object
          required: [publish]
          properties:
            publish:
              type: boolean
              description: true なら公開中、false なら下書きとして作る
    ItemImage:
      type: object
      description: STORAGE 商品写真と閲覧用の署名付きURL
      required: [objectKey, url, expiresAt]
      properties:
        objectKey:
          type: string
          description: 編集のときに imageObjectKeys に入れる
        url:
          type: string
          description: 署名付きURL（GET）
        expiresAt:
          type: string
          format: date-time
          description: 署名付きURLの有効期限
    OwnItem:
      type: object
      description: ITEM 出品者本人に見せる商品
      required: [id, shareId, status, title, category, condition, price, description, campus, images, textbook, furnitureAppliance, publishedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
        shareId:
          type: string
          description: 商品ページの固定URL `/items/:shareId` に使う
        status:
          $ref: '#/components/schemas/ItemStatus'
        title:
          type: string
        category:
          allOf:
            - $ref: '#/components/schemas/ItemCategory'
          nullable: true
        condition:
          allOf:
            - $ref: '#/components/schemas/ItemCondition'
          nullable: true
        price:
          type: integer
          format: int64
          nullable: true
        description:
          type: string
          nullable: true
        campus:
          allOf:
            - $ref: '#/components/schemas/Campus'
          nullable: true
        images:
          type: array
          description: 表示順
          items:
            $ref: '#/components/schemas/ItemImage'
        textbook:
          allOf:
            - $ref: '#/components/schemas/TextbookDetails'
          nullable: true
        furnitureAppliance:
          allOf:
            - $ref: '#/components/schemas/FurnitureApplianceDetails'
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: 最後に公開した日時。一度も公開していなければ null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      description: すべてのエラー応答の共通形式
      required: [code, message]
      properties:
        code:
          type: string
          description: 機械で判定するためのエラーコード（snake_case。例 invalid_status_transition）。共通コードの一覧は docs/tech/api.md の API-1
          example: invalid_status_transition
        message:
          type: string
          description: 利用者に表示できる日本語のメッセージ
          example: この取引はすでに完了しています
security:
  - sessionCookie: []
