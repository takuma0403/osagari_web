<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>商品一覧</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Outfit:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F7A80}a:hover{color:#155C61}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F8F5EE; color: #1B2B4B; font-family: 'Zen Kaku Gothic New', sans-serif; overflow: hidden">
  <header style="background: #FFFFFF; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #E4DFD3">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="width: 32px; height: 32px; border-radius: 8px; overflow: hidden; flex-shrink: 0"><img src="/_blob/1acda67ee7f900cbc97927dddc1267cf" alt="" style="width: 100%; height: 100%; object-fit: cover; transform: scale(1.32)"></div>
        <div style="font-size: 18px; font-weight: 700">佐賀大お下がりフリマ</div>
      </div>
      <button aria-label="お知らせ" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; color: #1B2B4B">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      </button>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 22px; background: #F8F5EE; color: #566178; font-size: 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="search" placeholder="教科書名・授業名・ISBNで検索" style="border: none; background: transparent; font: inherit; color: #1B2B4B; flex-grow: 1; outline: none">
    </label>
    <div style="display: flex; gap: 8px; overflow-x: auto">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <button style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
  </header>
  <main style="flex-grow: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h1 style="margin: 0; font-size: 16px; font-weight: 700">新着の出品</h1>
      <span style="font-size: 13px; color: #566178">新着順</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
        <a href="Detail.dc.html" style="display: flex; flex-direction: column; background: #FFFFFF; border-radius: 12px; overflow: hidden; text-decoration: none; color: #1B2B4B; border: 1px solid #E4DFD3">
          <div style="{{it.photo}}">
            <span style="font-size: 12px; color: #566178">写真</span>
            <span style="position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: #FFFFFF; color: #1B2B4B">{{it.cat}}</span>
          </div>
          <div style="padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 4px">
            <div style="font-size: 13px; font-weight: 500; line-height: 1.4; height: 36px; overflow: hidden">{{it.title}}</div>
            <div style="font-family: Outfit, sans-serif; font-weight: 700; font-size: 17px">¥{{it.price}}</div>
            <div style="font-size: 11px; color: #566178">{{it.campus}}キャンパス · {{it.cond}}</div>
          </div>
        </a>
      </sc-for>
    </div>
  </main>
  <nav style="display: flex; justify-content: space-around; background: #FFFFFF; border-top: 1px solid #E4DFD3; padding: 6px 0 18px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 44px; font-size: 11px; text-decoration: none; color: {{accent}}; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>ホーム</a>
    <a href="Search.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 44px; font-size: 11px; text-decoration: none; color: #566178"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>検索</a>
    <a href="Sell.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 44px; font-size: 11px; text-decoration: none; color: #566178"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><path d="M12 8v8M8 12h8"></path></svg>出品</a>
    <a href="DealRequests.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 44px; font-size: 11px; text-decoration: none; color: #566178"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3-3M20 16H6l3 3"></path></svg>取引</a>
    <a href="MyPage.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 44px; font-size: 11px; text-decoration: none; color: #566178"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>マイページ</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F7A80","options":["#1F7A80","#1B2B4B","#2F6FA3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#1F7A80';
    const on = 'flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: none; font: inherit; font-size: 13px; font-weight: 700; background: ' + accent + '; color: #FFFFFF';
    const off = 'flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E4DFD3; font: inherit; font-size: 13px; background: #FFFFFF; color: #1B2B4B';
    const cats = ['すべて', '教科書・参考書', '家具・家電', 'ゲーム', 'その他'].map((label, i) => ({ label, style: i === 0 ? on : off }));
    const tints = { '教科書': '#DDF0F0', '家電': '#DCEEF6', '家具': '#FBF0CC', 'ゲーム': '#E1EFE3' };
    const ph = (t) => 'position: relative; aspect-ratio: 1 / 1; background: ' + t + '; display: flex; align-items: center; justify-content: center';
    const items = [
      { cat: '教科書', title: '微分積分学 第3版（書き込み少）', price: '1,200', campus: '本庄', cond: '目立った傷なし' },
      { cat: '家電', title: '一人暮らし用 冷蔵庫 2ドア 138L', price: '6,000', campus: '本庄', cond: 'やや傷あり' },
      { cat: '教科書', title: '解剖学講義 改訂3版', price: '3,500', campus: '鍋島', cond: '書き込みあり' },
      { cat: '家具', title: 'ローテーブル 折りたたみ', price: '800', campus: '本庄', cond: '目立った傷なし' },
      { cat: 'ゲーム', title: '携帯ゲーム機 本体＋ソフト2本', price: '15,000', campus: '本庄', cond: '良好' },
      { cat: '教科書', title: 'ミクロ経済学入門', price: '900', campus: '本庄', cond: '新品同様' }
    ].map((it) => ({ ...it, photo: ph(tints[it.cat]) }));
    return { accent, cats, items };
  }
}
</script>
</body>
</html>
