<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>完了リンク・コードの発行</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Outfit:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F7A80}a:hover{color:#155C61}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F8F5EE; color: #1B2B4B; font-family: 'Zen Kaku Gothic New', sans-serif; overflow: hidden">
  <header style="height: 56px; flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #E4DFD3; display: flex; align-items: center; padding: 0 4px; gap: 4px">
    <a href="DealQR.dc.html" aria-label="戻る" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1B2B4B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 17px; font-weight: 700; flex-grow: 1">受け渡し</h1>
    <span style="margin-right: 12px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: #DDF0F0; color: #155C61">取引中</span>
  </header>
  <main style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <section style="padding: 22px 16px; background: #FFFFFF; border: 1px solid #E4DFD3; border-radius: 16px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
        <div style="width: 52px; height: 52px; border-radius: 26px; background: #DDF0F0; color: #1F7A80; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg></div>
        <h2 style="margin: 0; font-size: 20px; font-weight: 700">{{title}}</h2>
        <p style="margin: 0; font-size: 14px; line-height: 1.7; color: #566178">Teamsで購入者に送ってください。購入者が開く（入力する）と受け渡し完了になります。</p>
      </div>
      <sc-if value="{{isLink}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="done-link" style="font-size: 13px; font-weight: 700">完了リンク</label>
          <div style="display: flex; gap: 8px">
            <input id="done-link" readonly value="https://[ドメイン]/deals/[取引ID]/complete#…" style="flex-grow: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #E4DFD3; border-radius: 10px; background: #F8F5EE; font-family: Outfit, sans-serif; font-size: 14px; color: #1B2B4B">
            <button style="flex-shrink: 0; height: 48px; padding: 0 18px; border: none; border-radius: 24px; background: #1F7A80; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">コピー</button>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{isCode}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
          <span style="font-size: 12px; color: #566178">6桁の完了コード</span>
          <span style="font-family: Outfit, sans-serif; font-size: 34px; font-weight: 700; letter-spacing: 0.12em">582 017</span>
          <button style="height: 44px; padding: 0 22px; border: none; border-radius: 22px; background: #1F7A80; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">コピー</button>
        </div>
      </sc-if>
      <dl style="margin: 0; padding-top: 14px; border-top: 1px solid #E4DFD3; display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 16px; row-gap: 8px; font-size: 13px">
        <dt style="color: #566178">有効期限</dt><dd style="margin: 0">あと <b style="font-family: Outfit, sans-serif">23:58</b>（24時間）</dd>
        <dt style="color: #566178">使える回数</dt><dd style="margin: 0">1回（使うと無効になります）</dd>
      </dl>
    </section>
    <div style="display: flex; gap: 10px; padding: 14px; border-radius: 12px; background: #DCEEF6; color: #1B3A55; font-size: 13px; line-height: 1.7">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8v.01"></path></svg>
      <span>完了させるのは購入者です。購入者には「商品を受け取りましたか？」の確認が表示され、受け取ったあとに完了すると代金が確定します。</span>
    </div>
    <a href="DealQR.dc.html" style="align-self: center; font-size: 14px; color: #566178; padding: 12px">受け渡し画面に戻る</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["完了リンク","完了コード"],"default":"完了リンク"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? '完了リンク';
    const isLink = kind === '完了リンク';
    return {
      isLink,
      isCode: !isLink,
      title: isLink ? '完了リンクを発行しました' : '完了コードを発行しました'
    };
  }
}
</script>
</body>
</html>
