<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>マイページ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Outfit:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F7A80}a:hover{color:#155C61}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F8F5EE; color: #1B2B4B; font-family: 'Zen Kaku Gothic New', sans-serif; overflow: hidden">
  <main style="flex-grow: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <h1 style="margin: 0; font-size: 20px; font-weight: 700">マイページ</h1>
    <section style="padding: 16px; border-radius: 14px; background: #1F7A80; color: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; color: #1F7A80; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700">理</div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: Outfit, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0.04em">26238001</span>
          <span style="font-size: 13px; color: #D4EEEE">理工学部 理工学科 · 2026年度入学</span>
        </div>
      </div>
      <div style="display: flex; justify-content: space-between; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.25); font-size: 13px">
        <span style="color: #D4EEEE">アカウント有効期限</span>
        <span style="font-weight: 700">2030年3月31日</span>
      </div>
    </section>
    <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid #E4DFD3">
      <button role="tab" aria-selected="true" style="height: 44px; border: none; border-bottom: 3px solid #1F7A80; background: transparent; font: inherit; font-size: 14px; font-weight: 700; color: #1B2B4B">出品した商品 3</button>
      <button role="tab" aria-selected="false" style="height: 44px; border: none; border-bottom: 3px solid transparent; background: transparent; font: inherit; font-size: 14px; color: #566178">購入した商品 1</button>
    </div>
    <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px; background: #FFFFFF; border: 1px solid #E4DFD3; border-radius: 12px">
        <div style="width: 52px; height: 52px; border-radius: 8px; background: #DDF0F0; flex-shrink: 0"></div>
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
          <span style="font-size: 14px; font-weight: 700">{{it.title}}</span>
          <span style="font-family: Outfit, sans-serif; font-size: 14px">¥{{it.price}}</span>
        </div>
        <span style="{{it.badge}}">{{it.status}}</span>
      </div>
    </sc-for>
    <nav aria-label="設定" style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E4DFD3; border-radius: 12px">
      <a href="Sales.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 14px; font-size: 14px; color: #1B2B4B; text-decoration: none">売上管理<span style="color: #566178">›</span></a>
      <a href="StudentCard.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 14px; font-size: 14px; color: #1B2B4B; text-decoration: none; border-top: 1px solid #E4DFD3">学生証の登録<span style="font-size: 12px; color: #6B4E00">審査中 ›</span></a>
    </nav>
  </main>
  <nav style="display: flex; justify-content: space-around; background: #FFFFFF; border-top: 1px solid #E4DFD3; padding: 6px 0 18px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 44px; font-size: 11px; text-decoration: none; color: #566178"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>ホーム</a>
    <a href="Search.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 44px; font-size: 11px; text-decoration: none; color: #566178"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>検索</a>
    <a href="Sell.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 44px; font-size: 11px; text-decoration: none; color: #566178"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><path d="M12 8v8M8 12h8"></path></svg>出品</a>
    <a href="DealRequests.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 44px; font-size: 11px; text-decoration: none; color: #566178"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3-3M20 16H6l3 3"></path></svg>取引</a>
    <a href="MyPage.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 44px; font-size: 11px; text-decoration: none; color: #1F7A80; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>マイページ</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const b = (bg, fg) => 'flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 10px; background: ' + bg + '; color: ' + fg;
    return {
      items: [
        { title: '線形代数入門', price: '1,500', status: '購入希望 3件', badge: b('#FBEFC4', '#6B4E00') },
        { title: 'ローテーブル 折りたたみ', price: '800', status: '取引中', badge: b('#DDF0F0', '#155C61') },
        { title: '電気スタンド', price: '500', status: '下書き', badge: b('#EFEBE2', '#566178') }
      ]
    };
  }
}
</script>
</body>
</html>
