<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ログイン時の本人確認</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Outfit:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F7A80}a:hover{color:#155C61}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFFFFF; color: #1B2B4B; font-family: 'Zen Kaku Gothic New', sans-serif">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 4px">
    <a href="Login.dc.html" aria-label="ログイン画面に戻る" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1B2B4B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
  </header>
  <main style="flex-grow: 1; padding: 4px 24px 28px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="width: 52px; height: 52px; border-radius: 26px; background: #DDF0F0; color: #1F7A80; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg></div>
      <h1 style="margin: 0; font-size: 24px; font-weight: 700">本人確認をお願いします</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.75; color: #566178">{{reasonText}}</p>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #F8F5EE">
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
        <span style="font-size: 12px; color: #566178">コードの送信先</span>
        <span style="font-family: Outfit, sans-serif; font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">26238001@edu.cc.saga-u.ac.jp</span>
      </div>
      <a href="Login.dc.html" style="flex-shrink: 0; font-size: 13px; padding: 8px 0">別のアカウント</a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 700">メールに届いた6桁のコード</span>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{boxes}}" as="b" hint-placeholder-count="6">
          <input aria-label="{{b.label}}" value="{{b.v}}" inputmode="numeric" style="{{b.style}}">
        </sc-for>
      </div>
      <sc-if value="{{error}}" hint-placeholder-val="{{ false }}">
        <div role="alert" style="font-size: 13px; color: #A8322D; font-weight: 700">コードが違います。あと3回間違えるとこのコードは使えなくなります。</div>
      </sc-if>
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #566178">
        <span>有効期限 あと <b style="font-family: Outfit, sans-serif; color: #1B2B4B">9:58</b></span>
        <button disabled style="border: none; background: transparent; font: inherit; font-size: 12px; color: #8792A8; padding: 0; min-height: 32px">コードを再送（0:58 後）</button>
      </div>
    </div>
    <a href="Main.dc.html" style="height: 52px; border-radius: 26px; background: #1F7A80; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">確認してログイン</a>
    <div style="margin-top: auto; display: flex; gap: 10px; padding: 14px; border-radius: 12px; background: #FBEFC4; color: #4A3600; font-size: 12px; line-height: 1.75">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
      <span>卒業などで大学のメールが受け取れなくなると、この確認ができないためログインできません。メールが届かないときは、迷惑メールフォルダも確認してください。</span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;reason&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;30日経過&quot;,&quot;はじめての端末&quot;],&quot;default&quot;:&quot;30日経過&quot;},&quot;error&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    const reason = this.props.reason ?? '30日経過';
    const error = this.props.error ?? false;
    const reasonText = reason === '30日経過'
      ? 'パスワードは確認できました。前回メールで確認してから30日たったため、大学のメールに届いたコードを入力してください。'
      : 'パスワードは確認できました。はじめて使う端末からのログインのため、大学のメールに届いたコードを入力してください。次回からこの端末では不要です（30日ごとの確認を除く）。';
    const digits = ['', '', '', '', '', ''];
    const boxes = digits.map((v, i) => ({
      v,
      label: (i + 1) + '桁目',
      style: 'height: 52px; min-width: 0; text-align: center; border-radius: 8px; font-family: Outfit, sans-serif; font-size: 22px; color: #1B2B4B; background: #FFFFFF; border: ' +
        (error ? '1.5px solid #A8322D' : (i === 0 ? '1.5px solid #1F7A80' : '1px solid #E4DFD3'))
    }));
    return { reasonText, error, boxes };
  }
}
</script>
</body>
</html>
