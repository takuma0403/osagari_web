<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>管理：学生証審査</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Outfit:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F7A80}a:hover{color:#155C61}
</style>
</helmet>
<div style="min-height: 820px; display: flex; flex-wrap: wrap; background: #F8F5EE; color: #1B2B4B; font-family: 'Zen Kaku Gothic New', sans-serif">
  <nav aria-label="管理メニュー" style="flex: 1 1 220px; max-width: 100%; box-sizing: border-box; padding: 20px 14px; background: #1B2B4B; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px">
      <div style="width: 30px; height: 30px; border-radius: 8px; overflow: hidden; flex-shrink: 0"><img src="/_blob/1acda67ee7f900cbc97927dddc1267cf" alt="" style="width: 100%; height: 100%; object-fit: cover; transform: scale(1.32)"></div>
      <span style="font-size: 15px; font-weight: 700">管理画面</span>
    </div>
    <a href="#" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: 8px; background: #2A3D63; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none">学生証審査<span style="font-family: Outfit, sans-serif; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #F2C94C; color: #1B2B4B">12</span></a>
    <a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #C3CCDD; font-size: 14px; text-decoration: none">ユーザー</a>
    <a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #C3CCDD; font-size: 14px; text-decoration: none">出品・取引</a>
    <a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #C3CCDD; font-size: 14px; text-decoration: none">設定（手数料率）</a>
  </nav>
  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">学生証審査</h1>
      <span style="font-size: 13px; color: #566178">審査待ち 12件 · 古い順</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <section aria-label="審査待ち一覧" style="flex: 1 1 280px; min-width: 0; background: #FFFFFF; border: 1px solid #E4DFD3; border-radius: 12px; display: flex; flex-direction: column">
        <sc-for list="{{queue}}" as="q" hint-placeholder-count="6">
          <button style="{{q.style}}">
            <span style="display: flex; flex-direction: column; gap: 2px; align-items: flex-start">
              <span style="font-family: Outfit, sans-serif; font-size: 15px; font-weight: 700">{{q.id}}</span>
              <span style="font-size: 12px; color: #566178">{{q.dept}}</span>
            </span>
            <span style="font-size: 12px; color: #566178">{{q.at}}</span>
          </button>
        </sc-for>
      </section>
      <section aria-label="審査" style="flex: 2 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid #E4DFD3; border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-wrap: wrap; gap: 20px">
          <div style="flex: 1 1 280px; aspect-ratio: 1.6 / 1; border-radius: 10px; background: #DCEEF6; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #566178">学生証の画像</div>
          <dl style="flex: 1 1 200px; margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 16px; row-gap: 12px; font-size: 14px; align-content: start">
            <dt style="color: #566178">メールの学籍番号</dt><dd style="margin: 0; font-family: Outfit, sans-serif; font-weight: 700">26141023</dd>
            <dt style="color: #566178">推定した学部</dt><dd style="margin: 0">経済学部 経済学科</dd>
            <dt style="color: #566178">入学年度</dt><dd style="margin: 0">2026年度</dd>
            <dt style="color: #566178">有効期限</dt><dd style="margin: 0">2030年3月31日</dd>
          </dl>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="cardno" style="font-size: 13px; font-weight: 700">学生証に書かれた番号</label>
          <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
            <input id="cardno" value="26141023" style="width: 200px; height: 44px; border: 1.5px solid #1F7A80; border-radius: 10px; padding: 0 12px; font-family: Outfit, sans-serif; font-size: 17px">
            <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #155C61"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>メールの学籍番号と一致</span>
          </div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; padding-top: 16px; border-top: 1px solid #E4DFD3">
          <button style="height: 44px; padding: 0 28px; border: none; border-radius: 22px; background: #1F7A80; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700">承認する</button>
          <button style="height: 44px; padding: 0 22px; border-radius: 22px; border: 1px solid #E4DFD3; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; color: #1B2B4B">差し戻す</button>
          <span style="margin-left: auto; align-self: center; font-size: 12px; color: #566178">この画像の閲覧は記録されます（10/8 15:20 · 管理者A）</span>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      { id: '26141023', dept: '経済学部 経済学科', at: '10/6 10:12' },
      { id: '25238117', dept: '理工学部 理工学科', at: '10/6 13:40' },
      { id: '26212045', dept: '医学部 看護学科', at: '10/7 08:55' },
      { id: '24101032', dept: '教育学部 学校教育課程', at: '10/7 19:21' },
      { id: '26271008', dept: 'コスメティックサイエンス学環', at: '10/8 09:03' },
      { id: '72612004', dept: '不明（表にないコード）', at: '10/8 11:47' }
    ];
    const queue = data.map((q, i) => ({
      ...q,
      style: 'display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 60px; padding: 0 16px; border: none; text-align: left; font: inherit; color: #1B2B4B; cursor: pointer; ' +
        (i ? 'border-top: 1px solid #E4DFD3; background: #FFFFFF' : 'background: #DDF0F0; box-shadow: inset 4px 0 0 #1F7A80') + (i === 0 ? '; border-radius: 12px 12px 0 0' : '')
    }));
    return { queue };
  }
}
</script>
</body>
</html>
