<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>検索結果</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Outfit:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F7A80}a:hover{color:#155C61}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F8F5EE; color: #1B2B4B; font-family: 'Zen Kaku Gothic New', sans-serif; overflow: hidden">
  <header style="background: #FFFFFF; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #E4DFD3">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="Main.dc.html" aria-label="戻る" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1B2B4B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <label style="flex-grow: 1; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 22px; background: #F8F5EE">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#566178" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input type="search" value="線形代数" aria-label="キーワード" style="border: none; background: transparent; font: inherit; font-size: 15px; color: #1B2B4B; flex-grow: 1; outline: none; min-width: 0">
      </label>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #E4DFD3; background: #FFFFFF; font: inherit; font-size: 13px; display: flex; align-items: center; gap: 6px; color: #1B2B4B"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>絞り込み</button>
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
        <button style="height: 36px; padding: 0 10px 0 12px; border-radius: 18px; border: none; background: #DDF0F0; color: #155C61; font: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 4px">{{c}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </sc-for>
    </div>
  </header>
  <main style="flex-grow: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 13px; color: #566178">12件 · 新着順</div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <a href="Detail.dc.html" style="display: flex; gap: 12px; padding: 10px; background: #FFFFFF; border: 1px solid #E4DFD3; border-radius: 12px; text-decoration: none; color: #1B2B4B">
        <div style="width: 84px; height: 84px; flex-shrink: 0; border-radius: 8px; background: #DDF0F0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #566178">写真</div>
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1">
          <div style="font-size: 14px; font-weight: 700; line-height: 1.4">{{r.title}}</div>
          <div style="font-size: 12px; color: #566178">{{r.course}}</div>
          <div style="display: flex; align-items: center; justify-content: space-between; margin-top: auto">
            <span style="font-family: Outfit, sans-serif; font-weight: 700; font-size: 17px">¥{{r.price}}</span>
            <span style="font-size: 11px; padding: 3px 8px; border-radius: 10px; background: #F8F5EE; color: #566178">{{r.note}}</span>
          </div>
        </div>
      </a>
    </sc-for>
  </main>
  <nav style="display: flex; justify-content: space-around; background: #FFFFFF; border-top: 1px solid #E4DFD3; padding: 6px 0 18px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 44px; font-size: 11px; text-decoration: none; color: #566178"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>ホーム</a>
    <a href="Search.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 44px; font-size: 11px; text-decoration: none; color: #1F7A80; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>検索</a>
    <a href="Sell.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 44px; font-size: 11px; text-decoration: none; color: #566178"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><path d="M12 8v8M8 12h8"></path></svg>出品</a>
    <a href="DealRequests.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 44px; font-size: 11px; text-decoration: none; color: #566178"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3-3M20 16H6l3 3"></path></svg>取引</a>
    <a href="MyPage.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 44px; font-size: 11px; text-decoration: none; color: #566178"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>マイページ</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      chips: ['教科書・参考書', '本庄', '〜¥2,000'],
      rows: [
        { title: '線形代数入門', course: '線形代数学I · 理工学部', price: '1,500', note: '書き込みなし' },
        { title: '線形代数 演習ノート付き', course: '線形代数学II', price: '800', note: '書き込みあり' },
        { title: 'やさしい線形代数', course: '基礎数学', price: '1,000', note: '書き込みなし' },
        { title: '線形代数学 講義と演習', course: '線形代数学I', price: '1,800', note: '書き込み少' },
        { title: '行列と線形代数', course: '工業数学', price: '600', note: '書き込みあり' }
      ]
    };
  }
}
</script>
</body>
</html>
