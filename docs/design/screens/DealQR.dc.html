<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>受け渡しQRの表示</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Outfit:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F7A80}a:hover{color:#155C61}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F8F5EE; color: #1B2B4B; font-family: 'Zen Kaku Gothic New', sans-serif; overflow: hidden">
  <header style="height: 56px; flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #E4DFD3; display: flex; align-items: center; padding: 0 4px; gap: 4px">
    <a href="DealRequests.dc.html" aria-label="戻る" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1B2B4B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 17px; font-weight: 700; flex-grow: 1">受け渡し</h1>
    <span style="margin-right: 12px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: #DDF0F0; color: #155C61">取引中</span>
  </header>
  <main style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <section style="padding: 22px 16px; background: #FFFFFF; border: 1px solid #E4DFD3; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <p style="margin: 0; font-size: 14px; text-align: center; line-height: 1.7">商品を確認してもらってから、<br>購入者にこのコードを読み取ってもらいます。</p>
      <div aria-label="受け渡し用QRコード" style="padding: 14px; border-radius: 12px; border: 1px solid #E4DFD3; background: #FFFFFF">
        <div style="display: grid; grid-template-columns: repeat(21, 10px); grid-auto-rows: 10px">
          <sc-for list="{{cells}}" as="c" hint-placeholder-count="441">
            <div style="{{c}}"></div>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-size: 12px; color: #566178">カメラが使えないときの確認コード</span>
        <span style="font-family: Outfit, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: 0.12em">381 902</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #566178">
        <span>あと <b style="font-family: Outfit, sans-serif; color: #1B2B4B">4:32</b> で無効</span>
        <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E4DFD3; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; color: #1B2B4B">表示し直す</button>
      </div>
    </section>
    <section style="padding: 14px; background: #FFFFFF; border: 1px solid #E4DFD3; border-radius: 12px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 14px; font-weight: 700">読み取ってもらい忘れたとき</div>
      <p style="margin: 0; font-size: 13px; color: #566178; line-height: 1.7">完了リンクか6桁のコードを発行してTeamsで送ってください（24時間有効）。</p>
      <div style="display: flex; gap: 8px">
        <button style="flex-grow: 1; height: 44px; border-radius: 22px; border: 1px solid #1F7A80; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; color: #1F7A80">完了リンクを発行</button>
        <button style="flex-grow: 1; height: 44px; border-radius: 22px; border: 1px solid #1F7A80; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; color: #1F7A80">完了コードを発行</button>
      </div>
    </section>
    <a href="#" style="align-self: center; font-size: 13px; color: #566178; padding: 12px">取引のキャンセルを申請（相手の同意が必要）</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const n = 21;
    const finder = (r, c) => {
      const inBox = (r0, c0) => r >= r0 && r < r0 + 7 && c >= c0 && c < c0 + 7;
      const boxes = [[0, 0], [0, n - 7], [n - 7, 0]];
      for (const [r0, c0] of boxes) {
        if (inBox(r0, c0)) {
          const rr = r - r0, cc = c - c0;
          const ring = rr === 0 || rr === 6 || cc === 0 || cc === 6;
          const core = rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4;
          return ring || core ? 1 : 0;
        }
        if (r >= r0 - 1 && r <= r0 + 7 && c >= c0 - 1 && c <= c0 + 7) return 0;
      }
      return -1;
    };
    const cells = [];
    let seed = 7;
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        seed = (seed * 1103515245 + 12345) % 2147483648;
        const f = finder(r, c);
        const on = f === -1 ? (seed >> 16) % 2 === 0 : f === 1;
        cells.push('background: ' + (on ? '#1B2B4B' : '#FFFFFF'));
      }
    }
    return { cells };
  }
}
</script>
</body>
</html>
