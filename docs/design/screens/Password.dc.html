<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>パスワード設定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Outfit:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F7A80}a:hover{color:#155C61}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFFFFF; color: #1B2B4B; font-family: 'Zen Kaku Gothic New', sans-serif">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 4px">
    <a href="Code.dc.html" aria-label="戻る" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1B2B4B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
  </header>
  <main style="flex-grow: 1; padding: 8px 24px 32px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-family: Outfit, sans-serif; font-size: 13px; font-weight: 700; color: #1F7A80">STEP 3 / 3</span>
      <h1 style="margin: 0; font-size: 24px; font-weight: 700">{{title}}</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.7; color: #566178">次回からは、メールアドレスとこのパスワードでログインします。</p>
    </div>
    <sc-if value="{{signup}}" hint-placeholder-val="{{ true }}">
      <dl style="margin: 0; padding: 14px; border-radius: 12px; background: #F8F5EE; display: grid; grid-template-columns: 88px minmax(0, 1fr); row-gap: 8px; font-size: 13px">
        <dt style="color: #566178">学籍番号</dt><dd style="margin: 0; font-family: Outfit, sans-serif; font-weight: 700">26238001</dd>
        <dt style="color: #566178">学部・学科</dt><dd style="margin: 0">理工学部 理工学科</dd>
        <dt style="color: #566178">有効期限</dt><dd style="margin: 0">2030年3月31日</dd>
      </dl>
    </sc-if>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="pw1" style="font-size: 13px; font-weight: 700">パスワード</label>
      <div style="display: flex; align-items: center; height: 52px; border: 1.5px solid #1F7A80; border-radius: 10px; padding: 0 4px 0 14px">
        <input id="pw1" type="password" value="sagaunifurima" autocomplete="new-password" style="flex-grow: 1; min-width: 0; border: none; outline: none; font: inherit; font-size: 17px; color: #1B2B4B; background: transparent">
        <button aria-label="パスワードを表示" style="width: 44px; height: 44px; border: none; background: transparent; color: #566178; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #155C61; font-weight: 700">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>10文字以上（13文字）
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="pw2" style="font-size: 13px; font-weight: 700">パスワード（確認）</label>
      <input id="pw2" type="password" value="sagaunifurima" autocomplete="new-password" style="height: 52px; box-sizing: border-box; border: 1px solid #E4DFD3; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 17px; color: #1B2B4B">
    </div>
    <sc-if value="{{reset}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 12px 14px; border-radius: 12px; background: #FBEFC4; color: #4A3600; font-size: 13px; line-height: 1.7">変更すると、ほかの端末ではログアウトされます。</div>
    </sc-if>
    <a href="Main.dc.html" style="margin-top: auto; height: 52px; border-radius: 26px; background: #1F7A80; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">{{cta}}</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["新規登録","パスワード再設定"],"default":"新規登録"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const signup = (this.props.mode ?? '新規登録') === '新規登録';
    return {
      signup,
      reset: !signup,
      title: signup ? 'パスワードを決める' : '新しいパスワード',
      cta: signup ? '登録してはじめる' : 'パスワードを変更する'
    };
  }
}
</script>
</body>
</html>
