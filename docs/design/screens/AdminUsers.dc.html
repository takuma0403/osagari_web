<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>管理：ユーザー</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Outfit:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F7A80}a:hover{color:#155C61}
</style>
</helmet>
<div style="min-height: 820px; display: flex; flex-wrap: wrap; background: #F8F5EE; color: #1B2B4B; font-family: 'Zen Kaku Gothic New', sans-serif">
  <nav aria-label="管理メニュー" style="flex: 1 1 220px; max-width: 100%; box-sizing: border-box; padding: 20px 14px; background: #1B2B4B; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px 20px">
      <div style="width: 30px; height: 30px; border-radius: 8px; overflow: hidden; flex-shrink: 0"><img src="/_blob/1acda67ee7f900cbc97927dddc1267cf" alt="" style="width: 100%; height: 100%; object-fit: cover; transform: scale(1.32)"></div>
      <span style="font-size: 15px; font-weight: 700">管理画面</span>
    </div>
    <a href="AdminCard.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #C3CCDD; font-size: 14px; text-decoration: none">学生証審査<span style="font-family: Outfit, sans-serif; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #F2C94C; color: #1B2B4B">12</span></a>
    <a href="AdminUsers.dc.html" aria-current="page" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; background: #2A3D63; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none">ユーザー</a>
    <a href="AdminDeals.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #C3CCDD; font-size: 14px; text-decoration: none">出品・取引</a>
    <a href="AdminSettings.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 8px; color: #C3CCDD; font-size: 14px; text-decoration: none">設定（手数料率）</a>
  </nav>
  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">ユーザー</h1>
      <span style="font-size: 13px; color: #566178">退学申請 2件</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
      <label style="flex: 1 1 260px; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border: 1px solid #E4DFD3; border-radius: 10px; background: #FFFFFF; color: #566178">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">学籍番号で検索</span>
        <input type="search" placeholder="学籍番号で検索" style="border: none; background: transparent; font-family: Outfit, sans-serif; font-size: 15px; color: #1B2B4B; flex-grow: 1; outline: none; min-width: 0">
      </label>
      <div role="group" aria-label="状態で絞り込み" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
          <button aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <section aria-label="ユーザー一覧" style="flex: 3 1 480px; min-width: 0; background: #FFFFFF; border: 1px solid #E4DFD3; border-radius: 12px; overflow-x: auto">
        <table style="width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap">
          <thead>
            <tr style="text-align: left; color: #566178">
              <th style="padding: 12px 16px; font-weight: 700; border-bottom: 1px solid #E4DFD3">学籍番号</th>
              <th style="padding: 12px 16px; font-weight: 700; border-bottom: 1px solid #E4DFD3">学部</th>
              <th style="padding: 12px 16px; font-weight: 700; border-bottom: 1px solid #E4DFD3">状態</th>
              <th style="padding: 12px 16px; font-weight: 700; border-bottom: 1px solid #E4DFD3">出品者</th>
              <th style="padding: 12px 16px; font-weight: 700; border-bottom: 1px solid #E4DFD3">有効期限</th>
              <th style="padding: 12px 16px; font-weight: 700; border-bottom: 1px solid #E4DFD3">キャンセル</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{users}}" as="u" hint-placeholder-count="6">
              <tr style="{{u.row}}">
                <td style="padding: 12px 16px; font-family: Outfit, sans-serif; font-size: 15px; font-weight: 700">{{u.id}}</td>
                <td style="padding: 12px 16px">{{u.dept}}</td>
                <td style="padding: 12px 16px"><span style="{{u.badge}}">{{u.status}}</span></td>
                <td style="padding: 12px 16px; color: #566178">{{u.seller}}</td>
                <td style="padding: 12px 16px">{{u.exp}}</td>
                <td style="padding: 12px 16px; font-family: Outfit, sans-serif">{{u.cancels}}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </section>
      <section aria-label="ユーザーの詳細" style="flex: 2 1 320px; min-width: 0; background: #FFFFFF; border: 1px solid #E4DFD3; border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
          <span style="font-family: Outfit, sans-serif; font-size: 22px; font-weight: 700">25238117</span>
          <span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: #DDF0F0; color: #155C61">有効</span>
          <span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: #FBEFC4; color: #6B4E00">退学申請あり</span>
        </div>
        <dl style="margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 16px; row-gap: 10px; font-size: 14px">
          <dt style="color: #566178">学部</dt><dd style="margin: 0">理工学部 理工学科</dd>
          <dt style="color: #566178">出品者の承認</dt><dd style="margin: 0">承認済み</dd>
          <dt style="color: #566178">進行中の取引</dt><dd style="margin: 0">1件</dd>
          <dt style="color: #566178">キャンセル回数</dt><dd style="margin: 0; font-family: Outfit, sans-serif">4</dd>
        </dl>
        <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #E4DFD3">
          <label for="exp" style="font-size: 13px; font-weight: 700">有効期限の変更</label>
          <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
            <input id="exp" type="date" value="2029-03-31" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #E4DFD3; border-radius: 10px; font-family: Outfit, sans-serif; font-size: 15px; color: #1B2B4B">
            <button style="height: 44px; padding: 0 20px; border: none; border-radius: 22px; background: #1F7A80; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">変更する</button>
          </div>
          <span style="font-size: 12px; color: #566178">延長の仕組みができるまでの暫定の操作です。</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; padding-top: 16px; border-top: 1px solid #E4DFD3">
          <button style="height: 44px; padding: 0 20px; border-radius: 22px; border: 1px solid #E4DFD3; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; color: #1B2B4B">アカウントを停止</button>
          <button style="height: 44px; padding: 0 20px; border-radius: 22px; border: 1.5px solid #A8322D; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; color: #A8322D">退学によりアカウントを削除</button>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const chipOn = 'height: 36px; padding: 0 14px; border: none; border-radius: 18px; font: inherit; font-size: 13px; font-weight: 700; background: #1F7A80; color: #FFFFFF';
    const chipOff = 'height: 36px; padding: 0 14px; border: 1px solid #E4DFD3; border-radius: 18px; font: inherit; font-size: 13px; background: #FFFFFF; color: #1B2B4B';
    const filters = ['すべて', '有効', '停止', '失効', '退学申請'].map((label, i) => ({ label, on: i === 0 ? 'true' : 'false', style: i === 0 ? chipOn : chipOff }));
    const badge = {
      '有効': 'font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: #DDF0F0; color: #155C61',
      '停止': 'font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: #FBE7E4; color: #8A2621',
      '失効': 'font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: #F8F5EE; color: #566178; border: 1px solid #E4DFD3'
    };
    const data = [
      { id: '26141023', dept: '経済学部', status: '有効', seller: '審査中', exp: '2030/3/31', cancels: '0' },
      { id: '25238117', dept: '理工学部', status: '有効', seller: '承認済み', exp: '2029/3/31', cancels: '4' },
      { id: '24101032', dept: '教育学部', status: '停止', seller: '承認済み', exp: '2028/3/31', cancels: '7' },
      { id: '26212045', dept: '医学部', status: '有効', seller: '未登録', exp: '2030/3/31', cancels: '0' },
      { id: '22238090', dept: '理工学部', status: '失効', seller: '承認済み', exp: '2026/3/31', cancels: '1' },
      { id: '25141077', dept: '経済学部', status: '有効', seller: '差し戻し', exp: '2029/3/31', cancels: '0' }
    ];
    const users = data.map((u, i) => ({
      ...u,
      badge: badge[u.status],
      row: i === 1 ? 'background: #DDF0F0; box-shadow: inset 4px 0 0 #1F7A80' : 'border-top: 1px solid #E4DFD3'
    }));
    return { filters, users };
  }
}
</script>
</body>
</html>
