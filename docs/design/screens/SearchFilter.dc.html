<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>検索の絞り込み</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Outfit:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F7A80}a:hover{color:#155C61}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: #F8F5EE; color: #1B2B4B; font-family: 'Zen Kaku Gothic New', sans-serif; overflow: hidden">
  <header style="background: #FFFFFF; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #E4DFD3">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="Search.dc.html" aria-label="戻る" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1B2B4B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <label style="flex-grow: 1; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 22px; background: #F8F5EE">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#566178" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input type="search" value="線形代数" aria-label="キーワード" style="border: none; background: transparent; font: inherit; font-size: 15px; color: #1B2B4B; flex-grow: 1; outline: none; min-width: 0">
      </label>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #E4DFD3; background: #FFFFFF; font: inherit; font-size: 13px; display: flex; align-items: center; gap: 6px; color: #1B2B4B"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>絞り込み</button>
    </div>
  </header>
  <main style="flex-grow: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 13px; color: #566178">12件 · 新着順</div>
    <div style="height: 106px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E4DFD3"></div>
    <div style="height: 106px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E4DFD3"></div>
  </main>

  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(27, 43, 75, 0.55)"></div>
  <div role="dialog" aria-labelledby="filter-title" style="position: absolute; left: 0; bottom: 0; width: 390px; max-height: 780px; box-sizing: border-box; border-radius: 20px 20px 0 0; background: #FFFFFF; display: flex; flex-direction: column">
    <div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 8px">
      <div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #E4DFD3"></div>
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 id="filter-title" style="margin: 0; font-size: 20px; font-weight: 700">絞り込み</h2>
        <button onClick="{{clear}}" style="min-height: 44px; padding: 0 4px 0 12px; border: none; background: transparent; font: inherit; font-size: 14px; font-weight: 700; color: #1F7A80">クリア</button>
      </div>
    </div>

    <div style="flex-grow: 1; overflow-y: auto; padding: 8px 20px 16px; display: flex; flex-direction: column; gap: 20px">
      <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px">
        <legend style="padding: 0; margin-bottom: 10px; font-size: 13px; font-weight: 700">カテゴリ</legend>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
            <button aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
          </sc-for>
        </div>
      </fieldset>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="course" style="font-size: 13px; font-weight: 700">授業名</label>
        <input id="course" placeholder="例：線形代数学I" style="height: 48px; border: 1px solid #E4DFD3; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 15px; background: #FFFFFF; color: #1B2B4B">
      </div>

      <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
        <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 700">価格帯</legend>
        <div style="display: flex; align-items: center; gap: 8px">
          <div style="flex: 1 1 0; min-width: 0; display: flex; align-items: center; height: 48px; box-sizing: border-box; border: 1px solid #E4DFD3; border-radius: 10px; padding: 0 12px; background: #FFFFFF; gap: 6px"><span aria-hidden="true" style="font-family: Outfit, sans-serif; font-size: 17px">¥</span><input aria-label="価格の下限" inputmode="numeric" placeholder="下限なし" value="{{priceMin}}" style="border: none; outline: none; font-family: Outfit, sans-serif; font-size: 17px; flex-grow: 1; min-width: 0; color: #1B2B4B"></div>
          <span aria-hidden="true" style="font-size: 15px; color: #566178">〜</span>
          <div style="{{maxBox}}"><span aria-hidden="true" style="font-family: Outfit, sans-serif; font-size: 17px">¥</span><input aria-label="価格の上限" inputmode="numeric" placeholder="上限なし" value="{{priceMax}}" style="border: none; outline: none; font-family: Outfit, sans-serif; font-size: 17px; flex-grow: 1; min-width: 0; color: #1B2B4B"></div>
        </div>
        <sc-if value="{{error}}" hint-placeholder-val="{{ false }}">
          <div role="alert" style="font-size: 13px; color: #A8322D">上限は下限以上にしてください</div>
        </sc-if>
      </fieldset>

      <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px">
        <legend style="padding: 0; margin-bottom: 10px; font-size: 13px; font-weight: 700">受け渡し希望キャンパス</legend>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <sc-for list="{{campuses}}" as="c" hint-placeholder-count="3">
            <button aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
          </sc-for>
        </div>
      </fieldset>

      <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px">
        <legend style="padding: 0; margin-bottom: 10px; font-size: 13px; font-weight: 700">状態</legend>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <sc-for list="{{conds}}" as="c" hint-placeholder-count="4">
            <button aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
          </sc-for>
        </div>
      </fieldset>
    </div>

    <div style="padding: 12px 20px 28px; border-top: 1px solid #E4DFD3">
      <button style="width: 100%; height: 52px; border: none; border-radius: 26px; background: #1F7A80; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700">この条件で検索</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"error":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: '教科書・参考書', campus: '本庄', cond: '指定なし' };
  }
  renderVals() {
    const error = this.props.error ?? false;
    const on = 'flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: none; font: inherit; font-size: 13px; font-weight: 700; background: #1F7A80; color: #FFFFFF';
    const off = 'flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E4DFD3; font: inherit; font-size: 13px; background: #FFFFFF; color: #1B2B4B';
    const group = (key, labels) => labels.map((label) => ({
      label,
      pressed: this.state[key] === label ? 'true' : 'false',
      style: this.state[key] === label ? on : off,
      pick: () => this.setState({ [key]: label })
    }));
    const box = 'flex: 1 1 0; min-width: 0; display: flex; align-items: center; height: 48px; box-sizing: border-box; border-radius: 10px; padding: 0 12px; background: #FFFFFF; gap: 6px; ';
    return {
      error,
      cats: group('cat', ['すべて', '教科書・参考書', '家具・家電', 'ゲーム・その他']),
      campuses: group('campus', ['指定なし', '本庄', '鍋島']),
      conds: group('cond', ['指定なし', '新品同様', '目立った傷なし', 'やや傷あり']),
      priceMin: error ? '3,000' : '',
      priceMax: '2,000',
      maxBox: box + (error ? 'border: 1.5px solid #A8322D' : 'border: 1px solid #E4DFD3'),
      clear: () => this.setState({ cat: 'すべて', campus: '指定なし', cond: '指定なし' })
    };
  }
}
</script>
</body>
</html>
